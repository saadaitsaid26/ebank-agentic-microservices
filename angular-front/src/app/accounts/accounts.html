<div class="p">
  @if (accounts$|async; as accountList){
    <table class="table">
      <thead>
      <tr>
        <th>ID</th><th>Balance</th><th>Date</th><th>Type</th><th>Customer ID</th>
      </tr>
      </thead>
      <tbody>
        @for (acc of accountList; track acc) {
          <tr>
            <td>{{acc.id}}</td>
            <td>{{acc.balance}}</td>
            <td>{{acc.createdAt}}</td>
            <td>{{acc.type}}</td>
            <td>{{acc.customerId}}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
