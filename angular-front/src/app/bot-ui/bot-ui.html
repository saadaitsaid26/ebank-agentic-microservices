<div class="p-3">
  <div class="input-group m-2">
    <input [(ngModel)]="query" type="text" class="form-control" placeholder="Rechercher...">
    <button (click)="askAgent()" class="btn btn-primary" type="button">
      <i class="bi bi-search"></i>
    </button>
  </div>
  @if (loadService.isLoading()){
    <div class="spinner-border" role="status">
      <span class="sr-only"></span>
    </div>
  }
  <div class="card-body">
    @if (response$ | async ; as botResponse){
      <markdown [data]="botResponse"></markdown>
    }
  </div>
</div>
