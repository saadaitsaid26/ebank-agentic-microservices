
spring.application.name=ebank-bot

spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
# Correction 1 : spring.ai.openai.chat.options.model (et non .chat.model)
spring.ai.openai.chat.options.model=qwen/qwen3.8-27b

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false

server.port=8058
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8056/mcp
spring.ai.mcp.client.streamable-http.connections.ebank.url=http://localhost:8057/mcp

# Ne pas tenter de connexion MCP au demarrage (evite le crash si les services MCP ne sont pas encore lances)
spring.ai.mcp.client.initialized=false

# Logs Spring AI
logging.level.org.springframework.ai=INFO

discord.token=${DISCORD_TOKEN}